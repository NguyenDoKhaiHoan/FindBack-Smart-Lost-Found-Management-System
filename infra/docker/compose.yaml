services:
  postgres:
    image: postgres:16-alpine
    container_name: findback_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-findback}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-findback_secret}
      POSTGRES_DB: ${POSTGRES_DB:-findback}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - findback_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-findback} -d ${POSTGRES_DB:-findback}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  findback_postgres_data:
    name: findback_postgres_data
