[project]
name = "findback-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.13,<2", "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3", "pwdlib[argon2,bcrypt]>=0.3,<1", "email-validator>=2,<3",
  "python-multipart>=0.0.26,<1", "pillow>=12,<13", "openai>=2,<3",
  "huggingface-hub>=0.34,<3", "numpy>=1.26,<3", "onnxruntime>=1.24,<2",
  "tokenizers>=0.22,<1",
  "scikit-learn>=1.8,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "jsonschema>=4.23,<5", "ruff>=0.8,<1", "openapi-spec-validator>=0.7,<1"]
ai = ["sentence-transformers>=5,<6", "open-clip-torch>=3,<4", "torch>=2.6,<3", "torchvision>=0.21,<1"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL test database"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
